<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <nav>
        <table>
            <tr>
                <td><a href="../index.html">Home</a></td>
                <td><a href="./contactme.html">Contact Me</a></td>
                <td><a href="./myprojects.html">My Projects</a></td>
            </tr>
        </table>

    <br>
    <form action="mailto:disturbnothing@gmail.com" method="post">
        <fieldset>
            <legend>Contact Me</legend>
            <label for="Yourname">Your Name :</label>
            <input type="text" name="Name" id="Yourname" placeholder="example : john"><br><br>
            <label for="Youremail">Your Email :</label>
            <input type="email" name="Email" id="Youremail" placeholder="example : toto120@gmail.com"><br><br>
            <label>Gender :</label>
            <label for="male">M</label>
            <input type="radio" name="sex" id="male">
            <label for="female">F</label>
            <input type="radio" name="sex" id="female"><br><br>
            <label for="thedate">Date :</label>
            <input type="date" name="date" id="thedate"><br><br>
            <label for="yourmessage">Your Message :</label><br>
            <textarea name="message" id="yourmessage" cols="40" rows="10" required></textarea><br>
            <input type="submit" value="Send">
        </fieldset>
    </form><br>

    </footer>
